spring.application.name=task-time-tracker
spring.datasource.url=jdbc:h2:mem:trackerdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=postgres
spring.datasource.password=ksusha
spring.sql.init.mode=always
spring.jackson.serialization.write-dates-as-timestamps=false
jwt.secret=MySuperSecretKeyForJWTThatMustBeAtLeast32CharactersLong!
jwt.expiration=86400000

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.timetracker.task_time_tracker.model
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.filter=true

